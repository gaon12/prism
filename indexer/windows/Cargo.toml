[package]
name = "prism-ntfs-windows"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[dependencies]
prism-ntfs-core = { path = "../core" }
prism-ntfs-protocol = { path = "../protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Services", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = "3"
