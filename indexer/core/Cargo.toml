[package]
name = "prism-ntfs-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[dependencies]
prism-ntfs-protocol = { path = "../protocol" }
sha2 = { version = "0.10", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[features]
cache = ["dep:sha2"]

[dev-dependencies]
flate2 = "1"

[[example]]
name = "cache_reader_bench"
required-features = ["cache"]
