[package]
name = "prism"
version = "0.1.0"
description = "Prism desktop search workspace"
edition = "2021"
rust-version = "1.94"

[lib]
name = "prism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.1"
walkdir = "2.5.0"
unicode-normalization = "0.1"
chrono = "0.4"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
png = "0.18"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
getrandom = "0.3"
flate2 = "1"
quick-xml = "0.38"
encoding_rs = "0.8"
pdf-extract = "0.10"
cfb = "0.14"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "time", "sync"] }
lancedb = { version = "=0.41.0", default-features = false }
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
futures = "0.3"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
# Windows long-path handling for Lance's atomic local transaction persistence.
tempfile = { path = "vendor/tempfile" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects"] }

