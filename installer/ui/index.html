<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prism Setup</title>
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <!-- The whole window (760 x 480, no title bar). `data-screen` picks which screen is shown
         (see setup.js). Layout, the same on every screen, like a game launcher installer:
         - the art fills the window (it is also the drag area),
         - one large action button sits in the lower middle,
         - small things live in the corners: status and checkboxes bottom-left,
           secondary links bottom-right, window buttons top-right. -->
    <main class="setup" data-screen="loading">
      <section class="hero" data-tauri-drag-region>
        <!-- A thin beam enters a glass prism and leaves as one narrow, continuous spectrum.
             Drawn like a technical illustration: ink lines on a flat light ground. While
             installing, the spectrum grows stronger with the progress (CSS variable --done). -->
        <svg
          class="art"
          viewBox="0 0 760 480"
          preserveAspectRatio="xMidYMid slice"
          aria-hidden="true"
          data-tauri-drag-region
        >
          <defs>
            <!-- colours across the band, top (long wavelength) to bottom -->
            <linearGradient
              id="spectrum"
              gradientUnits="userSpaceOnUse"
              x1="0"
              y1="118"
              x2="0"
              y2="262"
            >
              <stop offset="0" stop-color="#e2735c" />
              <stop offset=".22" stop-color="#e9b85c" />
              <stop offset=".44" stop-color="#8fbf86" />
              <stop offset=".68" stop-color="#5f9ccb" />
              <stop offset="1" stop-color="#8d7cc4" />
            </linearGradient>
            <!-- the band is faint as it leaves the glass and full where it meets the edge -->
            <linearGradient id="spread" x1="0" x2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".25" />
              <stop offset=".55" stop-color="#fff" stop-opacity="1" />
            </linearGradient>
            <mask id="spread-mask">
              <rect x="422" y="0" width="338" height="480" fill="url(#spread)" />
            </mask>
          </defs>
          <path class="beam" d="M0 236 L341 167" />
          <g class="rays" mask="url(#spread-mask)">
            <path d="M422 174 L760 118 L760 262 Z" fill="url(#spectrum)" />
          </g>
          <g class="prism-shape">
            <path class="face" d="M380 92 450 228 310 228Z" />
            <path class="edge" d="M380 92v91l70 45M380 183l-70 45" />
            <path class="beam inner" d="M341 167 L422 174" />
          </g>
        </svg>

        <div class="title" data-tauri-drag-region>
          <h1>Prism</h1>
          <p class="version" id="version"></p>
        </div>

        <div class="window-buttons">
          <button class="window-button" id="minimize" type="button" data-label="minimize">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" /></svg>
          </button>
          <button class="window-button" id="close" type="button" data-label="close">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="m1.5 1.5 7 7m0-7-7 7" /></svg>
          </button>
        </div>
      </section>

      <!-- Install: one button. Folder and shortcuts are folded into "Custom settings". -->
      <form class="screen screen-options" id="options-form">
        <div class="sheet" id="options-sheet" role="group" aria-labelledby="folder-label">
          <label class="field-label" id="folder-label" for="folder" data-text="folderLabel"></label>
          <div class="folder-row">
            <input id="folder" spellcheck="false" autocomplete="off" />
            <button type="button" class="secondary" id="browse" data-text="browse"></button>
          </div>
          <div class="sheet-checks">
            <label class="check"
              ><input type="checkbox" id="start-menu" /><span data-text="startMenu"></span
            ></label>
            <label class="check"
              ><input type="checkbox" id="desktop" /><span data-text="desktop"></span
            ></label>
          </div>
        </div>
        <button type="submit" class="primary" id="install"></button>
        <p class="hint below-cta" id="folder-hint" aria-live="polite"></p>
        <!-- Agreement, like a launcher: a round checkbox and a link that opens the terms. -->
        <div class="agree foot-left">
          <label class="check"
            ><input type="checkbox" id="agree" /><span data-text="agreeLabel"></span
          ></label>
          <button type="button" class="terms-link" id="open-terms" data-text="termsLink"></button>
        </div>
        <div class="foot-right">
          <button
            type="button"
            class="link"
            id="previous-options"
            data-text="previous"
            hidden
          ></button>
          <button
            type="button"
            class="link"
            id="customize"
            aria-expanded="false"
            aria-controls="options-sheet"
          >
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="m2 3.5 3 3 3-3" /></svg>
            <span data-text="customize"></span>
          </button>
        </div>
      </form>

      <!-- Uninstall question -->
      <form class="screen screen-uninstall" id="uninstall-form">
        <div class="message">
          <p class="lead" data-text="uninstallLead"></p>
          <p class="hint" id="uninstall-folder"></p>
        </div>
        <button type="submit" class="danger" data-text="uninstall"></button>
        <label class="check foot-left"
          ><input type="checkbox" id="remove-data" /><span data-text="removeData"></span
        ></label>
        <div class="foot-right">
          <button
            type="button"
            class="link"
            id="previous-uninstall"
            data-text="previous"
            hidden
          ></button>
        </div>
      </form>

      <!-- Go back to the previous version -->
      <form class="screen screen-restore" id="restore-form">
        <div class="message">
          <p class="lead" id="restore-title"></p>
          <p class="hint" data-text="restoreData"></p>
          <p class="hint" id="restore-space"></p>
        </div>
        <button type="submit" class="danger" id="restore" data-text="restore" disabled></button>
        <label class="check foot-left"
          ><input type="checkbox" id="restore-ack" /><span data-text="restoreAck"></span
        ></label>
        <div class="foot-right">
          <button type="button" class="link" id="restore-back" data-text="back"></button>
        </div>
      </form>

      <!-- Progress: a thin spectrum bar along the bottom, like a launcher download. -->
      <div class="screen screen-progress">
        <div class="progress">
          <div class="progress-text">
            <span id="stage" aria-live="polite"></span>
            <span id="percent"></span>
          </div>
          <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="track">
            <div class="fill" id="fill"></div>
          </div>
        </div>
      </div>

      <!-- Finished (or failed) -->
      <form class="screen screen-done" id="done-form">
        <div class="message">
          <p class="lead" id="done-title"></p>
          <p class="hint" id="done-detail"></p>
        </div>
        <button type="submit" class="primary" id="finish" data-text="finish"></button>
        <label class="check foot-left" id="launch-option"
          ><input type="checkbox" id="launch" checked /><span data-text="launch"></span
        ></label>
      </form>
      <!-- Terms of use. Opened from the agreement link; "Agree" ticks the checkbox for you. -->
      <section
        class="terms"
        id="terms"
        role="dialog"
        aria-modal="true"
        aria-labelledby="terms-title"
        hidden
      >
        <h2 id="terms-title"></h2>
        <div class="terms-body" id="terms-body" tabindex="0"></div>
        <div class="terms-actions">
          <button type="button" class="link" id="terms-close" data-text="close"></button>
          <button type="button" class="solid" id="terms-agree" data-text="agree"></button>
        </div>
      </section>
    </main>
    <script src="messages.js"></script>
    <script src="terms.js"></script>
    <script src="setup.js"></script>
  </body>
</html>
