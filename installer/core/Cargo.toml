[package]
name = "prism-setup-core"
version = "0.0.0"
edition = "2021"
publish = false

# Compile the exact installer modules without linking its Tauri/WebView UI.
[lib]
path = "../src-tauri/src/core.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = [
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_FileSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

[dev-dependencies]
tempfile = "3"

[workspace]
