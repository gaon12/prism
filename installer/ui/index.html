<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prism Setup</title>
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <main class="setup" data-screen="loading">
      <header class="titlebar" data-tauri-drag-region>
        <div class="wordmark" data-tauri-drag-region>
          <svg viewBox="0 0 30 28" aria-hidden="true">
            <path d="M14 3 27 25H1Z" />
            <path class="logo-ray" d="m20 14 9 2m-8 1 8 3m-7 0 7 4" /></svg
          ><span>Prism</span><span class="version" id="version"></span>
        </div>
        <div class="appearance-controls">
          <select id="language" data-label="language">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="ja">日本語</option></select
          ><select id="theme" data-label="theme">
            <option value="system" data-text="themeSystem"></option>
            <option value="light" data-text="themeLight"></option>
            <option value="dark" data-text="themeDark"></option>
          </select>
        </div>
        <div class="window-buttons">
          <button class="window-button" id="minimize" type="button" data-label="minimize">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h10" /></svg></button
          ><button class="window-button" id="close" type="button" data-label="close">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2 2 8 8m0-8-8 8" /></svg>
          </button>
        </div>
      </header>
      <aside class="hero" data-tauri-drag-region>
        <div class="title" data-tauri-drag-region>
          <h1>Prism</h1>
          <p data-text="brandLine"></p>
        </div>
        <svg class="art" viewBox="0 0 300 360" aria-hidden="true" data-tauri-drag-region>
          <defs>
            <linearGradient id="glass" x1="0" x2="1">
              <stop stop-color="#eaf7ff" stop-opacity=".03" />
              <stop offset=".5" stop-color="#c7e7f6" stop-opacity=".2" />
              <stop offset="1" stop-color="#fff" stop-opacity=".04" />
            </linearGradient>
            <filter id="light"><feGaussianBlur stdDeviation="3" /></filter>
          </defs>
          <g class="optics">
            <circle cx="146" cy="177" r="111" />
            <path d="M146 45v16m0 232v16M13 177h16m234 0h16M51 82l11 11m168 168 11 11" />
          </g>
          <g class="spectrum glow" filter="url(#light)">
            <path d="m181 172 135-43" stroke="#f65b55" />
            <path d="m181 172 135-22" stroke="#ffcc53" />
            <path d="m181 172 135 0" stroke="#a4db69" />
            <path d="m181 172 135 22" stroke="#58d8eb" />
            <path d="m181 172 135 44" stroke="#6488f6" />
          </g>
          <g class="spectrum">
            <path d="m181 172 135-43" stroke="#f65b55" />
            <path d="m181 172 135-22" stroke="#ffcc53" />
            <path d="m181 172 135 0" stroke="#a4db69" />
            <path d="m181 172 135 22" stroke="#58d8eb" />
            <path d="m181 172 135 44" stroke="#6488f6" />
          </g>
          <path class="face" d="m146 82 73 165H72Z" />
          <path class="edge" d="m146 82-9 145 82 20m-82-20-65 20" />
          <path class="beam glow" filter="url(#light)" d="m-15 190 127-15 69-3" />
          <path class="beam" d="m-15 190 127-15 69-3" />
        </svg>
        <div class="brand-bottom">
          <strong data-text="brandDescription"></strong>
          <p data-text="brandTools"></p>
        </div>
      </aside>
      <div class="workspace">
        <div class="workspace-heading">
          <h2 id="setup-heading" data-text="setupTitle"></h2>
          <p id="setup-subtitle" data-text="setupSubtitle"></p>
        </div>
        <div class="screen screen-loading"><p class="loading-line" data-text="preparing"></p></div>
        <form class="screen screen-options" id="options-form">
          <div class="location-state" id="location-state" role="status">
            <span class="state-dot"></span
            ><span id="location-state-text" data-text="checkingFolder"></span>
          </div>
          <div class="sheet" id="options-sheet" role="group" aria-labelledby="folder-label">
            <label
              class="field-label"
              id="folder-label"
              for="folder"
              data-text="folderLabel"
            ></label>
            <div class="folder-row">
              <input id="folder" spellcheck="false" autocomplete="off" /><button
                type="button"
                class="secondary"
                id="browse"
                data-text="browse"
              ></button>
            </div>
            <p class="hint" id="folder-hint" aria-live="polite"></p>
            <div class="sheet-checks">
              <label class="check"
                ><input type="checkbox" id="start-menu" /><span data-text="startMenu"></span></label
              ><label class="check"
                ><input type="checkbox" id="desktop" /><span data-text="desktop"></span
              ></label>
            </div>
          </div>
          <div class="maintenance-actions">
            <button type="button" class="link" id="scan" data-text="scan" hidden></button
            ><button type="button" class="link" id="repair" data-text="repair" hidden></button
            ><button
              type="button"
              class="link"
              id="previous-options"
              data-text="previous"
              hidden
            ></button>
          </div>
          <p class="hint" id="scan-detail" aria-live="polite" hidden></p>
          <div class="action-footer">
            <div class="agreement">
              <div class="agree">
                <label class="check"
                  ><input type="checkbox" id="agree" /><span data-text="agreeLabel"></span></label
                ><button
                  type="button"
                  class="terms-link"
                  id="open-terms"
                  data-text="termsLink"
                ></button>
              </div>
              <div class="footer-links">
                <button
                  type="button"
                  class="link"
                  id="customize"
                  aria-expanded="true"
                  aria-controls="options-sheet"
                  data-text="customize"
                ></button
                ><button type="button" class="link detail-trigger" data-text="details"></button>
              </div>
            </div>
            <button type="submit" class="primary" id="install"></button>
          </div>
        </form>
        <form class="screen screen-uninstall" id="uninstall-form">
          <div class="message">
            <p class="lead" data-text="uninstallLead"></p>
            <p class="hint" id="uninstall-folder"></p>
            <p class="hint" data-text="uninstallHelp"></p>
          </div>
          <div class="action-footer">
            <div>
              <label class="check"
                ><input type="checkbox" id="remove-data" /><span
                  data-text="removeData"
                ></span></label
              ><button
                type="button"
                class="link"
                id="previous-uninstall"
                data-text="previous"
                hidden
              ></button
              ><button type="button" class="link detail-trigger" data-text="details"></button>
            </div>
            <button type="submit" class="danger" data-text="uninstall"></button>
          </div>
        </form>
        <form class="screen screen-restore" id="restore-form">
          <div class="message">
            <p class="lead" id="restore-title"></p>
            <p class="hint" data-text="restoreData"></p>
            <p class="hint" id="restore-space"></p>
          </div>
          <div class="action-footer">
            <div>
              <label class="check"
                ><input type="checkbox" id="restore-ack" /><span
                  data-text="restoreAck"
                ></span></label
              ><button type="button" class="link" id="restore-back" data-text="back"></button>
            </div>
            <button type="submit" class="danger" id="restore" data-text="restore" disabled></button>
          </div>
        </form>
        <div class="screen screen-progress">
          <div class="progress-symbol" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <path d="M24 5 44 40H4Z" />
              <path d="m16 25 9 9 18-20" />
            </svg>
          </div>
          <div class="progress">
            <div class="progress-text">
              <span id="stage" aria-live="polite"></span><span id="percent"></span>
            </div>
            <div
              class="track"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              data-label="progress"
              id="track"
            >
              <div class="fill" id="fill"></div>
            </div>
            <p class="hint" data-text="progressHelp"></p>
          </div>
          <div class="operation-summary">
            <span data-text="folderLabel"></span>
            <p id="progress-folder"></p>
          </div>
          <div class="action-footer">
            <p class="hint" data-text="dataKept"></p>
            <button type="button" class="secondary detail-trigger" data-text="details"></button>
          </div>
        </div>
        <form class="screen screen-done" id="done-form">
          <div class="done-symbol" aria-hidden="true" id="done-symbol">✓</div>
          <div class="message">
            <p class="lead" id="done-title"></p>
            <p class="hint" id="done-detail"></p>
          </div>
          <div class="action-footer">
            <div>
              <label class="check" id="launch-option"
                ><input type="checkbox" id="launch" checked /><span
                  data-text="launch"
                ></span></label
              ><button type="button" class="link detail-trigger" data-text="viewLog"></button>
            </div>
            <button type="submit" class="primary" id="finish" data-text="finish"></button>
          </div>
        </form>
      </div>
      <section
        class="modal terms"
        id="terms"
        role="dialog"
        aria-modal="true"
        aria-labelledby="terms-title"
        hidden
      >
        <div class="modal-heading"><h2 id="terms-title"></h2></div>
        <div class="terms-body" id="terms-body" tabindex="0"></div>
        <div class="terms-actions">
          <button type="button" class="link" id="terms-close" data-text="close"></button
          ><button type="button" class="solid" id="terms-agree" data-text="agree"></button>
        </div>
      </section>
      <section
        class="modal"
        id="details"
        role="dialog"
        aria-modal="true"
        aria-labelledby="details-title"
        hidden
      >
        <div class="modal-heading">
          <h2 id="details-title" data-text="detailsTitle"></h2>
          <button type="button" class="link" id="details-close" data-text="close"></button>
        </div>
        <div class="details-body">
          <dl class="detail-facts">
            <dt data-text="folderLabel"></dt>
            <dd id="detail-folder"></dd>
            <dt data-text="versionLabel"></dt>
            <dd id="detail-version"></dd>
            <dt data-text="logLocation"></dt>
            <dd id="log-path"></dd>
          </dl>
          <p class="hint" id="log-scope" hidden></p>
          <p class="hint" id="log-notice" role="status"></p>
          <pre id="log-text" tabindex="0"></pre>
        </div>
        <div class="terms-actions">
          <button
            type="button"
            class="secondary"
            id="open-log-folder"
            data-text="openLogFolder"
          ></button
          ><button type="button" class="secondary" id="refresh-log" data-text="refreshLog"></button
          ><button type="button" class="solid" id="copy-log" data-text="copyLog"></button>
        </div>
      </section>
      <section
        class="modal repair-confirm"
        id="repair-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="repair-title"
        hidden
      >
        <div class="modal-heading"><h2 id="repair-title" data-text="repairTitle"></h2></div>
        <div class="repair-body">
          <p data-text="repairHelp"></p>
          <p class="hint" id="repair-folder"></p>
          <label class="check"
            ><input type="checkbox" id="repair-ack" /><span data-text="repairAck"></span
          ></label>
        </div>
        <div class="terms-actions">
          <button type="button" class="link" id="repair-cancel" data-text="back"></button
          ><button
            type="button"
            class="solid"
            id="repair-confirm"
            data-text="repair"
            disabled
          ></button>
        </div>
      </section>
    </main>
    <script src="messages.js"></script>
    <script src="terms.js"></script>
    <script src="setup.js"></script>
  </body>
</html>
