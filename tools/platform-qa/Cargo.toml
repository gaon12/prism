[package]
name = "prism-platform-qa"
version = "0.0.0"
edition = "2021"
rust-version = "1.94"
publish = false

[profile.dev.package."sha2:0.10.9"]
opt-level = 3
[profile.dev.package."digest:0.10.7"]
opt-level = 3
[profile.dev.package."zlib-rs:0.6.8"]
opt-level = 3

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
base64 = "0.22"
walkdir = "2.5.0"
sha2 = "0.10"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
tokio = { version = "1.54.1", features = ["rt", "time"] }
zip = { version = "9.3", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
zeroize = "1"
quick-xml = "0.38"
encoding_rs = "0.8"
pdf-extract = "=0.12.1"
cfb = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
unicode-normalization = "0.1"
scraper = "0.24"
cssparser = "=0.35.0"
sha1 = "=0.10.6"
chrono = "0.4"
typst = "=0.15.1"
typst-pdf = "=0.15.1"
typst-layout = "=0.15.1"
msoffice-crypto = { version = "=0.1.0-rc.13", default-features = false, features = ["crypto-ops"] }
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
keyring-core = "=1.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "0.6"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSObject", "NSLocale", "NSEnumerator"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes", "block2", "objc2-core-graphics"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGGeometry", "CGImage", "CGPDFDocument", "CGPDFPage"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageDestination", "objc2-core-graphics"] }
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
hayro = "=0.9.0"
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_WinRT", "Globalization", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Data_Pdf"] }
windows-future = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"

[workspace]

[profile.dev.package.msoffice-crypto]
opt-level = 3
[profile.dev.package."sha2:0.11.1"]
opt-level = 3
[profile.dev.package."sha1:0.11.0"]
opt-level = 3

[patch.crates-io]
pdf-extract = { path = "../../src-tauri/vendor/pdf-extract" }
lopdf = { path = "../../src-tauri/vendor/lopdf" }
