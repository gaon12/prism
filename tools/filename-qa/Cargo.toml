[package]
name = "prism-filename-qa"
version = "0.0.0"
edition = "2021"
rust-version = "1.94"
publish = false

[dependencies]
notify = "8.2.1"
walkdir = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
unicode-normalization = "0.1"
tempfile = "3"
prism-ntfs-protocol = { path = "../../indexer/protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
prism-ntfs-windows = { path = "../../indexer/windows" }

[patch.crates-io]
tempfile = { path = "../../src-tauri/vendor/tempfile" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
debug = 0
