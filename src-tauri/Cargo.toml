[package]
name = "prism"
version = "0.1.0"
description = "Prism desktop search workspace"
edition = "2021"
rust-version = "1.94"

[lib]
name = "prism_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Preserve the original native parser feature set across the PDF upgrade.
memchr = { version = "2", features = ["use_std"] }
notify = "8.2.1"
walkdir = "2.5.0"
unicode-normalization = "0.1"
chrono = "0.4"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
png = "0.18"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
getrandom = "0.3"
flate2 = "1"
tar = "0.4"
quick-xml = "0.38"
encoding_rs = "0.8"
pdf-extract = "=0.12.1"
cfb = "0.14"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "time", "sync"] }
lancedb = { version = "=0.41.0", default-features = false }
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
futures = "0.3"
zeroize = "1"
prism-ntfs-protocol = { path = "../indexer/protocol" }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
keyring-core = "=1.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
# Windows long-path handling for Lance's atomic local transaction persistence.
tempfile = { path = "vendor/tempfile" }
# Native desktop builds do not need the upstream Wasm getrandom feature.
pdf-extract = { path = "vendor/pdf-extract" }
lopdf = { path = "vendor/lopdf" }

[target."cfg(windows)".dependencies]
prism-ntfs-windows = { path = "../indexer/windows" }
windows = { version = "0.62", features = ["ApplicationModel", "Win32_System_WinRT", "Globalization", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Data_Pdf"] }
windows-future = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects"] }

