[package]
name = "prism"
version = "0.1.0"
description = "Prism desktop search workspace"
edition = "2021"
rust-version = "1.94"

[lib]
name = "prism_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Preserve the original native parser feature set across the PDF upgrade.
memchr = { version = "2", features = ["use_std"] }
notify = "8.2.1"
walkdir = "2.5.0"
unicode-normalization = "0.1"
chrono = "0.4"
tauri-plugin-clipboard-manager = "2"
# Match the plugin's typed absence error before treating a read as an empty baseline.
arboard = { version = "=3.7.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
png = "0.18"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
base64 = "0.22"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
cssparser = "=0.35.0"
sha1 = "=0.10.6"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
getrandom = "0.3"
flate2 = "1"
tar = "0.4"
quick-xml = "0.38"
encoding_rs = "0.8"
pdf-extract = "=0.12.1"
cfb = "0.14"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "time", "sync", "macros"] }
lancedb = { version = "=0.41.0", default-features = false }
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
futures = "0.3"
typst = "=0.15.1"
typst-pdf = "=0.15.1"
typst-layout = "=0.15.1"
hwpforge-smithy-md = "=0.19.1"
hwpforge-smithy-hwpx = "=0.19.1"
hwpforge-core = "=0.19.1"
hwpforge-foundation = "=0.19.1"
msoffice-crypto = { version = "=0.1.0-rc.13", default-features = false, features = ["crypto-ops"] }
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }
unicase = "=2.10.0"
zeroize = "1"
prism-ntfs-protocol = { path = "../indexer/protocol" }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
keyring-core = "=1.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "0.6"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSObject", "NSLocale", "NSEnumerator"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes", "block2", "objc2-core-graphics"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGGeometry", "CGImage", "CGPDFDocument", "CGPDFPage"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageDestination", "objc2-core-graphics"] }
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
hayro = "=0.9.0"
# Native desktop queries and XTest paste without shell tools or keymap rewrites.
x11rb = { version = "=0.13.2", default-features = false, features = ["xtest"] }
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile = "3"
roxmltree = "=0.21.2"

# Large verified assets and whole-drive filename frames must remain usable in
# a debug app too. Optimize these CPU-heavy dependencies; app checks stay enabled.
[profile.dev.package.prism-ntfs-protocol]
opt-level = 3
[profile.dev.package.prism-ntfs-windows]
opt-level = 3
[profile.dev.package."sha2:0.10.9"]
opt-level = 3
[profile.dev.package."digest:0.10.7"]
opt-level = 3
[profile.dev.package."zlib-rs:0.6.8"]
opt-level = 3
[profile.dev.package.msoffice-crypto]
opt-level = 3
[profile.dev.package."sha2:0.11.1"]
opt-level = 3
[profile.dev.package."sha1:0.11.0"]
opt-level = 3

[patch.crates-io]
# Honor the desktop session's XDG_CONFIG_HOME for Linux login startup.
auto-launch = { path = "vendor/auto-launch" }
# Windows long-path handling for Lance's atomic local transaction persistence.
tempfile = { path = "vendor/tempfile" }
# Native desktop builds do not need the upstream Wasm getrandom feature.
pdf-extract = { path = "vendor/pdf-extract" }
lopdf = { path = "vendor/lopdf" }

[target."cfg(windows)".dependencies]
prism-ntfs-windows = { path = "../indexer/windows" }
windows = { version = "0.62", features = ["ApplicationModel", "Win32_System_WinRT", "Globalization", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Data_Pdf"] }
windows-future = "0.3"
# Same version Tauri's WebView2 backend (wry) uses; only for the memory target level.
webview2-com = "0.39.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Com", "Win32_Security_Authorization", "Win32_System_Power"] }

