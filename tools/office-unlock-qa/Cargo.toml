[package]
name = "prism-office-unlock-qa"
version = "0.0.0"
edition = "2021"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
msoffice-crypto = { version = "=0.1.0-rc.13", default-features = false, features = ["crypto-ops"] }
cfb = "=0.14.0"
quick-xml = "=0.38.4"
zeroize = "1"

[profile.dev.package.msoffice-crypto]
opt-level = 3
[profile.dev.package."sha2:0.11.1"]
opt-level = 3
[profile.dev.package."sha1:0.11.0"]
opt-level = 3
