name: Native path policy
on:
  pull_request:
    paths:
      - 'src-tauri/src/path_identity.rs'
      - 'src-tauri/src/document_extract.rs'
      - 'src-tauri/src/content_store.rs'
      - 'tools/platform-qa/**'
      - '.github/workflows/path-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Exercise the actual system aliases
        # Deliberately retain /var: using RUNNER_TEMP would hide this regression.
        env:
          TMPDIR: /var/tmp
        run: cargo +stable test --manifest-path tools/platform-qa/Cargo.toml --locked --lib -- --nocapture
