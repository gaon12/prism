[package]
name = "prism-platform-qa"
version = "0.0.0"
edition = "2021"
rust-version = "1.94"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
zip = { version = "9.3", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
zeroize = "1"
quick-xml = "0.38"
encoding_rs = "0.8"
pdf-extract = "=0.12.1"
cfb = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
unicode-normalization = "0.1"
scraper = "0.24"
chrono = "0.4"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
keyring-core = "=1.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile = "3"

[workspace]

[patch.crates-io]
pdf-extract = { path = "../../src-tauri/vendor/pdf-extract" }
lopdf = { path = "../../src-tauri/vendor/lopdf" }
