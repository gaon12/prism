[package]
name = "prism"
version = "0.1.0"
description = "Prism desktop search workspace"
edition = "2021"
rust-version = "1.90"

[lib]
name = "prism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.1"
walkdir = "2.5.0"
unicode-normalization = "0.1"
chrono = "0.4"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
png = "0.18"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
getrandom = "0.3"
flate2 = "1"
quick-xml = "0.38"
encoding_rs = "0.8"
pdf-extract = "0.10"
cfb = "0.14"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

