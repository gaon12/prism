# Build artifacts first. Publishing stays a separate, manually reviewed draft.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft release (select an existing matching version tag)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Keep the established job and artifact names for the existing platforms;
    # only the added ARM64 Linux build gets a suffix.
    name: Build ${{ matrix.platform }}${{ matrix.suffix }}
    # A cold build compiles LanceDB and Tauri from scratch; 120 minutes was too tight on Windows.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            verifier: tools/update-verifier/target/debug/prism-update-verifier.exe
            suffix: ''
          - platform: macos
            runner: macos-latest
            verifier: tools/update-verifier/target/debug/prism-update-verifier
            suffix: ''
          - platform: linux
            runner: ubuntu-22.04
            verifier: tools/update-verifier/target/debug/prism-update-verifier
            suffix: ''
            appimage: amd64
          - platform: linux
            runner: ubuntu-22.04-arm
            verifier: tools/update-verifier/target/debug/prism-update-verifier
            suffix: '-arm64'
            appimage: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      PRISM_UPDATER_PUBLIC_KEY: ${{ vars.PRISM_UPDATER_PUBLIC_KEY }}
      PRISM_UPDATE_VERIFIER: ${{ github.workspace }}/${{ matrix.verifier }}
      PRISM_MSIX_PACKAGE_VERSION: ${{ vars.PRISM_MSIX_PACKAGE_VERSION }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Use a temp folder without aliases
        # Prism deliberately refuses folder aliases: a path must equal its canonical form and must
        # not pass through a symlink. The runners' default temp folders break that rule, so tests
        # that create their fixtures there get rejected:
        #   - Windows TEMP is the 8.3 short path C:\Users\RUNNER~1\...
        #   - macOS TMPDIR is under /var/folders, and /var is a symlink to /private/var.
        # RUNNER_TEMP (D:\a\_temp, /Users/runner/work/_temp) is a plain, real path on both.
        if: matrix.platform != 'linux'
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check versions, tag and updater key configuration
        id: plan
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/release-config.mjs --platform '${{ matrix.platform }}' --output "$RUNNER_TEMP/prism-build.json"
      - name: Set up Python for the independent native PDF inspector
        if: matrix.platform == 'windows'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare the independent native PDF inspector
        # Fail before the Rust build if the document test's parser is unavailable.
        # The app itself does not require Python or pypdf.
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $taskVenv = Join-Path $env:RUNNER_TEMP 'prism-pdf-inspector'
          python -m venv $taskVenv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskPython = Join-Path $taskVenv 'Scripts/python.exe'
          & $taskPython -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r tests/native/requirements-pdf.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $taskPython -c "import pypdf; from pypdf import PdfReader; print('Independent PDF inspector: pypdf ' + pypdf.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PRISM_TEST_PYTHON=$taskPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Install universal macOS targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Save the compiled dependencies even when a later step fails. The
          # Windows job has been failing at the model gate, so it never saved a
          # cache and rebuilt every dependency from scratch (about 63 minutes).
          # Only third-party build outputs are cached, never this repo's crates.
          cache-on-failure: true
          workspaces: |
            src-tauri
            installer/src-tauri
            installer/core
            tools/update-verifier
            tools/platform-qa
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '34.1'
          repo-token: ${{ github.token }}
      - name: Install Linux system libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libclang-dev libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Test the independent artifact verifier
        run: |
          cargo test --manifest-path tools/update-verifier/Cargo.toml --locked
          cargo clippy --manifest-path tools/update-verifier/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test the exact runtime and credential platform modules
        run: |
          cargo test --manifest-path tools/platform-qa/Cargo.toml --locked
          cargo clippy --manifest-path tools/platform-qa/Cargo.toml --all-targets --locked -- -D warnings
          cargo fmt --manifest-path tools/platform-qa/Cargo.toml --check
      - name: Test the compact filename catalog module
        run: |
          cargo test --manifest-path tools/catalog-qa/Cargo.toml --locked
          cargo clippy --manifest-path tools/catalog-qa/Cargo.toml --all-targets --locked -- -D warnings
          cargo fmt --manifest-path tools/catalog-qa/Cargo.toml --check
      - name: Verify actual macOS Quartz PDF previews
        if: matrix.platform == 'macos'
        timeout-minutes: 5
        run: cargo test --manifest-path tools/platform-qa/Cargo.toml --locked macos_quartz_preserves_pdf_crop_rotation_and_preview_without_ocr -- --ignored --nocapture --test-threads=1
      - name: Verify actual macOS Korean Vision recognition
        if: matrix.platform == 'macos'
        timeout-minutes: 5
        # This forces System OCR. A missing native Korean capability is a real
        # unverified platform condition, not permission to claim a Paddle pass.
        run: cargo test --manifest-path tools/platform-qa/Cargo.toml --locked macos_native_ocr_pixels_pdf_passwords_and_resource_errors -- --ignored --nocapture --test-threads=1
      - name: Check client and release tooling
        run: |
          npm run format:check
          npm run check
          npm test
          npm run test:release
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path tools/update-verifier/Cargo.toml --check
      - name: Check native model asset preparation helper
        run: node --test tests/scripts/prepare-generation-assets.test.mjs
      - name: Check Windows package creation and setup core
        if: matrix.platform == 'windows'
        run: |
          npm run test:msix
          cargo test --manifest-path installer/core/Cargo.toml --locked
          cargo clippy --manifest-path installer/core/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build Windows app without NSIS
        if: matrix.platform == 'windows'
        env:
          BUILD_CONFIG: ${{ steps.plan.outputs.config }}
        run: npm run tauri -- build --no-bundle --config "$BUILD_CONFIG" -- --locked
      - name: Keep the built Windows app for low-end memory measurement
        # The 1 CPU / 512 MB job measurement (tests/native/harsh-profile.mjs)
        # only needs prism.exe. Upload it right after the build so a later
        # gate failure does not hide it. Not a release download (the draft
        # job only takes downloads-*), and kept for a week only.
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qa-windows-app
          path: src-tauri/target/release/prism.exe
          if-no-files-found: error
          retention-days: 7
      - name: Build universal macOS app and DMG
        if: matrix.platform == 'macos'
        env:
          BUILD_CONFIG: ${{ steps.plan.outputs.config }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg --config "$BUILD_CONFIG" -- --locked
      - name: Build Linux AppImage and .deb
        if: matrix.platform == 'linux'
        env:
          BUILD_CONFIG: ${{ steps.plan.outputs.config }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # The .deb (same binary) is only the input of the Flatpak bundle below.
        run: npm run tauri -- build --bundles appimage,deb --config "$BUILD_CONFIG" -- --locked
      - name: Test the native app library
        # On macOS the universal build compiled into target/aarch64-apple-darwin. Testing the same
        # target reuses those compiled dependencies instead of rebuilding everything for the host.
        env:
          TEST_TARGET: ${{ matrix.platform == 'macos' && '--target aarch64-apple-darwin' || '' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --lib --locked $TEST_TARGET
      - name: Verify production UI interactions
        if: matrix.platform == 'linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:bundle
      - name: Build the Windows setup with the release payload
        if: matrix.platform == 'windows'
        run: cargo build --manifest-path installer/src-tauri/Cargo.toml --release --locked
      - name: Ensure WebView2 exists on the disposable CI runner
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @("HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client", "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client")
          $installed = @($keys | ForEach-Object {
            $version = $null
            $value = (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv
            if ([version]::TryParse($value, [ref]$version) -and $version -gt [version]'0.0.0.0') { $version }
          })
          if ($installed.Count -gt 0) { exit 0 }
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Microsoft bootstrapper signature verification failed.' }
          $process = Start-Process -FilePath $bootstrapper -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "WebView2 setup failed: $($process.ExitCode)" }
      - name: Let the setup tests reach the setup WebView on the elevated runner
        # The setup tests drive the real setup window over the WebView debug port. WebView2 150+
        # ignores --remote-debugging-port from WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS when the app
        # runs elevated, and GitHub runners run as admin (MicrosoftEdge/WebView2Feedback#5645).
        # A machine policy is still honoured, so set one for prism-setup.exe only, on this
        # disposable runner. The tests read the same fixed port from PRISM_SETUP_CDP_PORT.
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'prism-setup.exe' -PropertyType String -Force `
            -Value '--remote-debugging-port=9339 --remote-debugging-address=127.0.0.1' | Out-Null
      - name: Verify release setup recovery and previous-version restoration
        # Native recovery uses inert crash fixtures and never starts the embedded app.
        if: matrix.platform == 'windows'
        shell: bash
        env:
          PRISM_SETUP_EXE: ${{ github.workspace }}/installer/src-tauri/target/release/prism-setup.exe
          PRISM_SETUP_EXPECTED_EXE: ${{ github.workspace }}/src-tauri/target/release/prism.exe
          PRISM_SETUP_CDP_PORT: '9339'
        run: |
          npm run test:setup-recovery
          npm run test:setup-previous
      - name: Let native model tests reach their owned app WebView
        # Match the setup test policy on this disposable hosted runner only.
        # Both native gates first verify their unique portable profile nonce.
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $taskKey = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $taskKey -Force | Out-Null
          New-ItemProperty -Path $taskKey -Name 'prism.exe' -PropertyType String -Force `
            -Value '--remote-debugging-port=9324 --remote-debugging-address=127.0.0.1' | Out-Null
      - name: Verify document sources, revisions and PDF/HWPX export in the actual app
        # About 30 s. Generation is a synthetic local server (no model), so this
        # checks the app's own document, citation and export paths, including
        # source paths kept literally in HWPX/PDF footnotes.
        if: matrix.platform == 'windows'
        timeout-minutes: 5
        env:
          PRISM_TEST_EXECUTABLE: ${{ github.workspace }}/src-tauri/target/release/prism.exe
          PRISM_TEST_EXPECT_RELEASE: '1'
          PRISM_APP_CDP_PORT: '9324'
        run: node tests/native/documents.mjs
      - name: Verify actual embedding download progress and cancellation
        if: matrix.platform == 'windows'
        timeout-minutes: 8
        env:
          PRISM_TEST_EXECUTABLE: ${{ github.workspace }}/src-tauri/target/release/prism.exe
          PRISM_TEST_EXPECT_RELEASE: '1'
          PRISM_APP_CDP_PORT: '9324'
          # Hosted runners finish the real download before it can be observed and
          # cancelled; relay the same official TLS bytes at 1 MiB/s.
          PRISM_TEST_DOWNLOAD_RATE: '1048576'
        run: node tests/native/model-progress.mjs
      - name: Prepare immutable native generation assets
        if: matrix.platform == 'windows'
        timeout-minutes: 20
        shell: pwsh
        env:
          PRISM_REAL_ASSET_DIR: ${{ runner.temp }}/prism-generation-assets-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/prepare-generation-assets.mjs $env:PRISM_REAL_ASSET_DIR
          exit $LASTEXITCODE
      - name: Verify actual local chat and document generation
        if: matrix.platform == 'windows'
        timeout-minutes: 15
        shell: pwsh
        env:
          PRISM_REAL_ASSET_DIR: ${{ runner.temp }}/prism-generation-assets-${{ github.run_id }}-${{ github.run_attempt }}
          PRISM_TEST_EXECUTABLE: ${{ github.workspace }}/src-tauri/target/release/prism.exe
          PRISM_TEST_EXPECT_RELEASE: '1'
          PRISM_TEST_SOURCE_SHA: ${{ github.sha }}
          PRISM_APP_CDP_PORT: '9324'
        run: |
          $taskAssetsPath = Join-Path $env:PRISM_REAL_ASSET_DIR 'assets.json'
          $taskAssets = Get-Content -LiteralPath $taskAssetsPath -Raw | ConvertFrom-Json
          $env:PRISM_REAL_GENERATION = $taskAssets.generation.path
          $env:PRISM_REAL_EMBEDDING = $taskAssets.embedding.path
          $env:PRISM_REAL_RUNTIME = $taskAssets.runtime.path
          $env:PRISM_TEST_APP_SHA256 = (Get-FileHash -LiteralPath $env:PRISM_TEST_EXECUTABLE -Algorithm SHA256).Hash.ToLowerInvariant()
          node tests/native/real-generation.mjs
          exit $LASTEXITCODE
      - name: Keep native model gate evidence on success or failure
        if: always() && matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-model-gates-windows
          path: |
            ${{ runner.temp }}/prism-model-progress-*/evidence/**
            ${{ runner.temp }}/prism-real-generation-*/evidence/**
            ${{ runner.temp }}/prism-generation-assets-*/status.json
            ${{ runner.temp }}/prism-documents-*/evidence/**
            ${{ runner.temp }}/prism-document-source-pdf-*/*.pdf
            ${{ runner.temp }}/prism-document-source-pdf-*/*.hwpx
          if-no-files-found: warn
          compression-level: 0
      - name: Collect Windows setup
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          New-Item -ItemType Directory out -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath installer/src-tauri/target/release/prism-setup.exe -Destination "out/Prism_${env:VERSION}_x64-setup.exe" -ErrorAction Stop
      - name: Package Windows portable copy
        if: matrix.platform == 'windows'
        run: npm run package:portable -- --out out
      - name: Build unsigned MSIX inspection artifact
        if: matrix.platform == 'windows'
        env:
          MSIX_VERSION: ${{ steps.plan.outputs.msix_version }}
        run: npm run package:msix -- --out inspection --package-version "$MSIX_VERSION"
      - name: Sign the custom Windows updater artifact with its version
        if: matrix.platform == 'windows' && steps.plan.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- signer sign --app-version "$VERSION" "out/Prism_${VERSION}_x64-setup.exe"
      - name: Collect macOS downloads
        if: matrix.platform == 'macos'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SIGNED: ${{ steps.plan.outputs.signed }}
        run: |
          mkdir out
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          images=("$bundle"/dmg/*.dmg)
          if [ "${#images[@]}" -ne 1 ] || [ ! -f "${images[0]}" ]; then exit 1; fi
          cp "${images[0]}" "out/Prism_${VERSION}_universal.dmg"
          if [ "$SIGNED" = true ]; then
            cp "$bundle/macos/Prism.app.tar.gz" "out/Prism_${VERSION}_universal.app.tar.gz"
            cp "$bundle/macos/Prism.app.tar.gz.sig" "out/Prism_${VERSION}_universal.app.tar.gz.sig"
          fi
      - name: Collect Linux download
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SIGNED: ${{ steps.plan.outputs.signed }}
          ARCH: ${{ matrix.appimage }}
        run: |
          mkdir out
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ "${#images[@]}" -ne 1 ] || [ ! -f "${images[0]}" ]; then exit 1; fi
          # Refuse an image whose ELF machine does not match this matrix entry.
          expected=$([ "$ARCH" = aarch64 ] && echo 'ARM aarch64' || echo 'x86-64')
          file -L "${images[0]}" | grep -q "$expected"
          cp "${images[0]}" "out/Prism_${VERSION}_${ARCH}.AppImage"
          if [ "$SIGNED" = true ]; then cp "${images[0]}.sig" "out/Prism_${VERSION}_${ARCH}.AppImage.sig"; fi
      - name: Install Flatpak tooling
        if: matrix.platform == 'linux'
        # Ubuntu 22.04's own flatpak is too old for current GNOME runtimes.
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build and check the Linux Flatpak
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          ARCH: ${{ matrix.appimage }}
        run: |
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ] || [ ! -f "${debs[0]}" ]; then exit 1; fi
          node scripts/build-flatpak.mjs --deb "${debs[0]}" --version "$VERSION" --arch "$ARCH" --out out
          test -s "out/Prism_${VERSION}_${ARCH}.flatpak"
      - name: Verify updater artifact against the app's public key
        if: steps.plan.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.appimage }}
        run: |
          case "$PLATFORM" in
            windows) file="Prism_${VERSION}_x64-setup.exe" ;;
            macos) file="Prism_${VERSION}_universal.app.tar.gz" ;;
            linux) file="Prism_${VERSION}_${ARCH}.AppImage" ;;
            *) exit 1 ;;
          esac
          "$PRISM_UPDATE_VERIFIER" --version "$VERSION" --file "out/$file"
      - name: Hash downloads
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release-checksums.mjs --dir out --version "$VERSION" --write
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: downloads-${{ matrix.platform }}${{ matrix.suffix }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
      - name: Keep unsigned MSIX separate from release downloads
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: inspection-windows-msix
          path: inspection/*
          if-no-files-found: error
          compression-level: 0

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.create_draft)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    env:
      PRISM_UPDATER_PUBLIC_KEY: ${{ vars.PRISM_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: downloads-*
          path: dist-release
          merge-multiple: true
      - name: Recheck release identity and download hashes
        run: |
          npm run version:check
          [ "$GITHUB_REPOSITORY" = 'gaon12/prism' ]
          version=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF" = "refs/tags/v$version" ]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node scripts/release-checksums.mjs --dir dist-release --version "$version" --check --complete
      - name: Build the manifest verifier
        if: env.PRISM_UPDATER_PUBLIC_KEY != ''
        run: cargo build --manifest-path tools/update-verifier/Cargo.toml --release --locked
      - name: Generate a complete, verified updater manifest
        if: env.PRISM_UPDATER_PUBLIC_KEY != ''
        run: node scripts/make-latest-json.mjs --dir dist-release --version "$VERSION" --repo "$GITHUB_REPOSITORY" --verifier tools/update-verifier/target/release/prism-update-verifier
      - name: Create a draft without publishing or replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "Prism $VERSION" "" \
            'Windows: custom setup and portable ZIP. macOS: universal DMG. Linux: x86_64 and ARM64 AppImage and Flatpak.' \
            'MSIX is a separate unsigned CI inspection artifact, pending a signing/distribution choice.' \
            'Windows Authenticode and Apple notarization are not configured for this build.' \
            'Review platform smoke tests, prerequisites and checksums before publishing.' > "$RUNNER_TEMP/release-notes.md"
          extra=()
          if [[ "$VERSION" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "v$VERSION" dist-release/* --draft --verify-tag "${extra[@]}" --title "Prism $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
