# Prism update server, nginx: paste these locations into the HTTPS server { } block of
# api.rasca99.dev (the one with "listen 443 ssl"). Files on disk, under that server's root:
#
#   <root>/prism/update.php
#   <root>/prism/latest.json        read by update.php, never served directly
#   <root>/prism/files/Prism_<version>_x64-setup.exe
#
# Plain HTTP should only redirect: in the port-80 server block use
#   return 301 https://$host$request_uri;
#
# Note on add_header: a location that sets its own add_header drops the server-level ones, so
# the files location repeats Strict-Transport-Security.

# The update check. Exact match, so it wins over the /prism/ rule below.
location = /prism/update.php {
    # update.php itself answers 405 for other methods; refuse them before PHP runs.
    limit_except GET { deny all; }   # GET also allows HEAD
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    # Adjust to this server's PHP-FPM socket (PHP 7.4 or newer).
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}

# Installers: only Prism's own package names, as plain downloads; no listing, no scripts.
location ^~ /prism/files/ {
    autoindex off;

    location ~ "^/prism/files/Prism_[0-9A-Za-z.+-]+_(x64-setup\.exe|amd64\.AppImage|aarch64\.AppImage|universal\.app\.tar\.gz)$" {
        types { }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
        # Short cache: a re-uploaded file with the same name must not stay stale for long,
        # otherwise its SHA-256 would no longer match latest.json and the update is refused.
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Anything else in files/ (other names, scripts, notes) does not exist.
    return 404;
}

# Everything else under /prism/: latest.json, notes, keys copied by mistake, other PHP files.
location ^~ /prism/ {
    return 404;
}
