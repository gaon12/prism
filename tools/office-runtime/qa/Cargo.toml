[package]
name = "prism-office-qa"
version = "0.0.0"
edition = "2021"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
walkdir = "2.5.0"
getrandom = "0.3"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
